[package]
name = "xccute_runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "MIT OR Apache-2.0"
description = "The execution half of xccute: the ShellCommand trait, RawCommand, CommandSpec, the chain executor with dry runs and capture modes, exit-status rules, and the connector, material, execution-gate and plan-transition seams a supervising system plugs into."
authors = ["James Hunt <james@1o.business>"]
repository = "https://github.com/jameshuntt/xccute_runtime"
readme = "README.md"
keywords = ["cli", "command", "execution", "runtime", "process"]
categories = ["command-line-interface"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
xccute_contract = { version = "0.1.0", path = "../xccute_contract" }

sha2 = "0.10.8"
